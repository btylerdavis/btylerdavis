<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffd447"><title>Tot Onesie</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#fff9ea;color:#4b2d20;font:700 18px system-ui}main{text-align:center;padding:24px}.monkey{display:inline-block;font-size:42px;animation:b .8s infinite alternate}@keyframes b{to{transform:translateY(-8px)}}small{display:block;opacity:.65;margin-top:8px}</style></head><body><main><div class="monkey">🐒</div><p>Opening Tot Onesie…</p><small>Back-zip bedtime is loading.</small></main><script>(async()=>{try{const files=['site-00.txt','site-01.txt','site-02.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error('Missing '+f);return r.text()}));const raw=atob(parts.join('').replace(/\s/g,''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Browser decompression is unavailable');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<main><div class="monkey">🐒</div><h1>Tot Onesie</h1><p>The site did not finish loading.</p><button onclick="location.reload()" style="border:2px solid #4b2d20;border-radius:999px;background:#ff6d5f;color:white;padding:12px 20px;font-weight:800;cursor:pointer">Reload site</button></main>'}})();</script></body></html>
