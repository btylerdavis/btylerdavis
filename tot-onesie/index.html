<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tot Onesie</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff9ea;color:#4b2d20;font:800 18px system-ui}main{text-align:center}.m{font-size:42px;animation:b .8s infinite alternate}@keyframes b{to{transform:translateY(-8px)}}</style></head><body><main><div class="m">🐒</div><p>Loading Tot Onesie…</p></main><script>(async()=>{try{const a=await Promise.all(['p1.txt','p2.txt','p3.txt','p4.txt'].map(x=>fetch(x).then(r=>{if(!r.ok)throw 0;return r.text()})));const u=Uint8Array.from(atob(a.join('')),c=>c.charCodeAt(0));const s=new DecompressionStream('gzip');const h=await new Response(new Blob([u]).stream().pipeThrough(s)).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<main><h1>Tot Onesie</h1><p>This browser could not open the preview.</p></main>'}})();</script></body></html>
