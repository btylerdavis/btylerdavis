<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tot Onesie</title><meta name="theme-color" content="#ffd447"><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#fff9ea;color:#4b2d20;font:800 18px system-ui}main{text-align:center;padding:24px}.monkey{font-size:48px;animation:b .8s infinite alternate}@keyframes b{to{transform:translateY(-10px)}}</style></head><body><main><div class="monkey">🐒</div><p>Opening Tot Onesie…</p></main><script>(async()=>{try{const names=['z1.txt','z2.txt','z3.txt'];const z=(await Promise.all(names.map(async n=>{const r=await fetch(n);if(!r.ok)throw new Error(n);return r.text()}))).join('');const bin=Uint8Array.from(atob(z),c=>c.charCodeAt(0));const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main><h1>Tot Onesie</h1><p>The preview could not load. Please refresh in a current version of Chrome, Safari, Edge, or Firefox.</p></main>'}})();</script></body></html>
