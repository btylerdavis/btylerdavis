<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tot Onesie</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff9ea;color:#4b2d20;font:800 18px system-ui}main{text-align:center}.m{font-size:42px;animation:b .8s infinite alternate}@keyframes b{to{transform:translateY(-8px)}}</style></head><body><main><div class="m">🐒</div><p>Loading Tot Onesie…</p></main><script>(async()=>{try{const names=['data-1.txt','data-2.txt','data-3.txt','data-4.txt'];const parts=await Promise.all(names.map(n=>fetch(n).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main><h1>Tot Onesie</h1><p>The preview could not load. Please refresh this page.</p></main>'}})();</script></body></html>
